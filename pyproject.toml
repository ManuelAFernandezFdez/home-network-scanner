[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-network-scanner"
version = "0.1.0"
description = "A local desktop application for authorized home network inventory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "psutil>=5.9,<8",
    "PySide6>=6.6,<7",
    "python-nmap>=0.7.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
home-network-scanner = "home_network_scanner.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]